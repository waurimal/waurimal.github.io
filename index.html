<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀테크(Edtech) 영어 학습 놀이터</title>
    <!-- 폰트 및 아이콘 불러오기 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 세련되고 팬시한 무료 폰트 (지마켓 산스) 추가 */
        @font-face {
            font-family: 'GmarketSansBold';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 디자인 */
        header {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-family: 'GmarketSansBold', 'Pretendard', sans-serif;
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: -0.02em;
            word-break: keep-all;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2); /* 팬시한 느낌을 위한 그림자 추가 */
        }

        header p {
            margin-top: 1rem;
            font-size: 1.15rem;
            opacity: 0.95;
            font-weight: 300;
        }

        /* 그리드 레이아웃 */
        .container {
            max-width: 1200px;
            margin: -2rem auto 2rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            flex-grow: 1; /* 푸터를 하단에 밀어내기 위함 */
        }

        /* 카드 디자인 */
        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        .card-icon {
            font-size: 3.5rem; /* 아이콘 크기 확대 */
            margin-bottom: 1.5rem;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .card h2 {
            margin: 0 0 1.5rem 0;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
        }

        /* 설명글 (개조식 & 내어쓰기 적용) */
        .card-desc {
            list-style: none;
            padding: 0;
            margin: 0 0 2rem 0;
            width: 100%;
            flex-grow: 1;
        }

        .card-desc li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.8rem;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.5;
            text-align: left;
            word-break: keep-all;
        }

        .card-desc li::before {
            content: "•";
            position: absolute;
            left: 0;
            font-weight: bold;
            color: var(--theme-color); /* 자바스크립트에서 주입받는 테마 컬러 */
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-primary {
            /* 배경색은 JS에서 동적으로 설정 */
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            filter: brightness(0.9);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #E5E7EB;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #D1D5DB;
        }

        /* 푸터 디자인 */
        .site-footer {
            text-align: center;
            padding: 2rem;
            color: #6B7280;
            font-size: 0.9rem;
            margin-top: 2rem;
        }

        .site-footer p {
            margin: 0.3rem 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>에듀테크(Edtech) 영어 학습 놀이터</h1>
        <p>수업을 더 즐겁고 효율적으로 만들어주는 스마트 학습 도구 모음</p>
    </header>

    <div class="container" id="app-container">
        <!-- 자바스크립트를 통해 카드가 동적으로 생성됩니다 -->
    </div>

    <!-- 하단 카피라이트 -->
    <footer class="site-footer">
        <p>만든이: 곽현석(이의초등학교)</p>
        <p>Copyright &copy; 2026 Eui Elementary School. All Rights Reserved.</p>
    </footer>

    <script>
        // 앱 데이터 (각 메뉴별 테마 컬러 및 불릿 설명 적용)
        const apps = [
            {
                id: "wordtyping",
                title: "단어 타자 연습",
                icon: "fas fa-keyboard",
                theme: "#3B82F6", // 블루
                bgTheme: "#EFF6FF",
                bullets: [
                    "정확하고 빠른 영어 타이핑 연습 지원",
                    "스펠링을 직접 입력하며 자연스러운 어휘력 향상"
                ],
                url: "https://waurimal.github.io/wordtyping/index.html"
            },
            {
                id: "hangman",
                title: "행맨 게임",
                icon: "fas fa-gamepad",
                theme: "#8B5CF6", // 퍼플
                bgTheme: "#F5F3FF",
                bullets: [
                    "숨겨진 철자를 추리하며 맞추는 흥미진진한 단어 게임",
                    "파닉스와 철자 구조를 복습하는 즐거운 놀이 활동"
                ],
                url: "https://waurimal.github.io/hangman/index.html"
            },
            {
                id: "alchemist",
                title: "연금술사 게임",
                icon: "fas fa-flask",
                theme: "#F97316", // 오렌지
                bgTheme: "#FFF7ED",
                bullets: [
                    "단어 조각을 합쳐 새로운 단어를 발견하는 창의력 게임",
                    "합성어의 원리와 단어 간의 관계를 재미있게 학습"
                ],
                url: "https://waurimal.github.io/alchemist/index.html"
            },
            {
                id: "eng_sen",
                title: "영어 문장 연습",
                icon: "fas fa-book-open",
                theme: "#10B981", // 에메랄드
                bgTheme: "#ECFDF5",
                bullets: [
                    "핵심 영어 문장 구조를 반복 타이핑하며 체화",
                    "소리 내어 읽기와 병행하여 말하기 및 작문 기초 다지기"
                ],
                url: "https://waurimal.github.io/eng_sen/index.html"
            },
            {
                id: "file_upload",
                title: "과제 파일 제출",
                icon: "fas fa-cloud-upload-alt",
                theme: "#6366F1", // 인디고
                bgTheme: "#EEF2FF",
                bullets: [
                    "구글 드라이브(Google Drive) 연동으로 수업 중 완성한 디지털 결과물 간편 제출",
                    "학생별 과제 파일을 선생님 드라이브에 한눈에 수합하고 안전하게 관리"
                ],
                url: "https://waurimal.github.io/file_upload/index.html"
            }
        ];

        // 앱 카드 동적 렌더링
        const container = document.getElementById('app-container');
        
        apps.forEach(app => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // 불릿 리스트 HTML 생성
            const bulletsHtml = app.bullets.map(bullet => `<li>${bullet}</li>`).join('');

            card.innerHTML = `
                <div class="card-icon" style="color: ${app.theme}; background-color: ${app.bgTheme};">
                    <i class="${app.icon}"></i>
                </div>
                <h2 style="color: ${app.theme};">${app.title}</h2>
                <ul class="card-desc" style="--theme-color: ${app.theme};">
                    ${bulletsHtml}
                </ul>
                <div class="btn-group">
                    <a href="${app.url}" class="btn btn-primary" style="background-color: ${app.theme};">앱 실행</a>
                    <!-- guide.html에 파라미터를 넘겨 어떤 앱의 설명인지 식별하도록 함 -->
                    <a href="guide.html?app=${app.id}" class="btn btn-secondary">사용 방법</a>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
