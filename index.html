<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀테크(Edtech) 영어 학습 놀이터</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'GmarketSansBold';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* 모든 요소에 패딩/테두리 포함하여 크기 계산 (가로 스크롤 방지) */
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-family: 'GmarketSansBold', 'Pretendard', sans-serif;
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        header p { margin-top: 0.5rem; font-size: 1rem; opacity: 0.9; }

        .container {
            max-width: 1200px;
            margin: -1.5rem auto 2rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            flex-grow: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 0.8rem;
            padding: 1.5rem 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover { transform: translateY(-3px); }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .card h2 { margin: 0 0 1rem 0; font-size: 1.25rem; font-weight: 700; }

        .card-desc { list-style: none; padding: 0; margin: 0 0 1.5rem 0; width: 100%; flex-grow: 1; }

        .card-desc li {
            position: relative;
            padding-left: 1rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: keep-all;
        }

        .card-desc li::before { content: "•"; position: absolute; left: 0; font-weight: bold; color: var(--theme-color); }

        .btn-group { display: flex; gap: 0.5rem; width: 100%; }

        .btn {
            flex: 1;
            padding: 0.6rem 0.5rem;
            border-radius: 0.4rem;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary { color: white; }
        .btn-secondary { background-color: #E5E7EB; color: var(--text-main); }

        .site-footer { text-align: center; padding: 1.5rem; color: #6B7280; font-size: 0.85rem; }

        /* 모바일 등 작은 화면을 위한 반응형 스타일 추가 */
        @media (max-width: 600px) {
            header { padding: 2rem 1rem; }
            header h1 { font-size: 1.8rem; }
            .container { 
                grid-template-columns: 1fr; /* 스마트폰에서는 1열로 꽉 차게 보이도록 설정 */
                margin-top: -1rem;
            }
            .card { padding: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>에듀테크(Edtech) 영어 학습 놀이터</h1>
        <p>수업을 더 즐겁고 효율적으로 만들어주는 스마트 학습 도구 모음</p>
    </header>

    <div class="container" id="app-container"></div>

    <footer class="site-footer">
        <p>만든이: 곽현석(이의초등학교)</p>
        <p>Copyright &copy; 2026 Eui Elementary School. All Rights Reserved.</p>
    </footer>

    <script>
        const apps = [
            { id: "wordtyping", title: "단어 타자 연습", icon: "fas fa-keyboard", theme: "#3B82F6", bgTheme: "#EFF6FF", bullets: ["정확한 타이핑 연습", "자연스러운 어휘력 향상"], url: "https://waurimal.github.io/wordtyping/index.html" },
            { id: "hangman", title: "행맨 게임", icon: "fas fa-gamepad", theme: "#8B5CF6", bgTheme: "#F5F3FF", bullets: ["철자 추리 단어 게임", "파닉스 구조 복습"], url: "https://waurimal.github.io/hangman/index.html" },
            { id: "alchemist", title: "연금술사", icon: "fas fa-flask", theme: "#F97316", bgTheme: "#FFF7ED", bullets: ["단어 조합 창의력", "합성어 원리 학습"], url: "https://waurimal.github.io/alchemist/index.html" },
            { id: "reading", title: "영어 읽기", icon: "fas fa-glasses", theme: "#DB2777", bgTheme: "#FDF2F8", bullets: ["단계별 독해 연습", "어휘력 향상"], url: "https://waurimal.github.io/reading/index.html" },
            { id: "eng_sen", title: "영어 문장", icon: "fas fa-book-open", theme: "#10B981", bgTheme: "#ECFDF5", bullets: ["핵심 문장 구조 체화", "말하기 기초 다지기"], url: "https://waurimal.github.io/sen_typing/index.html" },
            { id: "swarm", title: "Swarm 게임", icon: "fas fa-users", theme: "#0891B2", bgTheme: "#ECFEFF", bullets: ["실시간 협동 학습", "팀워크 전략 강화"], url: "https://waurimal.github.io/swarm/index.html" },
            { id: "tictac", title: "Tic Tac Toe 게임", icon: "fas fa-hashtag", theme: "#D97706", bgTheme: "#FEF3C7", bullets: ["전략적인 Tic Tac Toe 대결", "놀이를 통한 반복 학습"], url: "https://waurimal.github.io/tictac/index.html" },
            { id: "file_upload", title: "파일 제출", icon: "fas fa-cloud-upload-alt", theme: "#6366F1", bgTheme: "#EEF2FF", bullets: ["구글 드라이브 연동", "결과물 간편 제출"], url: "https://waurimal.github.io/file_upload/index.html" },
            { id: "senbattle", title: "영어문장 배틀", icon: "fas fa-bolt", theme: "#E11D48", bgTheme: "#FFF1F2", bullets: ["실시간 영어 문장 타이핑 대결", "경쟁을 통한 빠르고 정확한 체화"], url: "https://waurimal.github.io/senbattle/index.html" }
        ];

        const container = document.getElementById('app-container');
        apps.forEach(app => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-icon" style="color: ${app.theme}; background-color: ${app.bgTheme};">
                    <i class="${app.icon}"></i>
                </div>
                <h2 style="color: ${app.theme};">${app.title}</h2>
                <ul class="card-desc" style="--theme-color: ${app.theme};">
                    ${app.bullets.map(b => `<li>${b}</li>`).join('')}
                </ul>
                <div class="btn-group">
                    <a href="${app.url}" class="btn btn-primary" style="background-color: ${app.theme};" target="_blank">실행</a>
                    <a href="guide.html?app=${app.id}" class="btn btn-secondary">방법</a>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
