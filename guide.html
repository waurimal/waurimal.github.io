<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용 방법 안내 - 에듀테크 학습 놀이터</title>
    <!-- 폰트 및 아이콘 불러오기 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 메인 페이지와 동일한 폰트 및 기본 설정 */
        @font-face {
            font-family: 'GmarketSansBold';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #3B82F6;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 (메인 페이지와 통일성 유지) */
        header {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 3rem; /* 본문과의 간격 확보 */
        }

        header h1 {
            font-family: 'GmarketSansBold', 'Pretendard', sans-serif;
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.02em;
        }

        /* 가이드 컨텐츠 영역 */
        .guide-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
            flex-grow: 1; /* 푸터를 하단에 고정하기 위함 */
            width: 100%;
        }

        .guide-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .guide-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 2rem;
            color: var(--text-main);
            text-align: center;
            border-bottom: 2px solid #E5E7EB;
            padding-bottom: 1rem;
        }

        /* 탭 메뉴 스타일 */
        .tabs {
            display: flex;
            border-bottom: 2px solid #E5E7EB;
            margin-bottom: 2rem;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* 탭 내용(가이드 텍스트) 스타일 */
        .tab-content {
            display: none;
            font-size: 1.1rem;
            color: #374151;
            line-height: 1.8;
            white-space: pre-wrap; /* 줄바꿈 문자를 실제 화면에 반영 */
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 뒤로가기 버튼 */
        .back-btn-container {
            text-align: center;
            margin-bottom: 3rem;
        }

        .back-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: var(--text-main);
            color: white;
            text-decoration: none;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .back-btn:hover {
            background-color: #000;
        }

        /* 푸터 디자인 */
        .site-footer {
            text-align: center;
            padding: 1.5rem;
            color: #6B7280;
            font-size: 0.85rem;
            background-color: #E5E7EB; /* 본문 배경과 살짝 구분되게 설정 */
        }

        .site-footer p {
            margin: 0.3rem 0;
        }

        /* 모바일 반응형 */
        @media (max-width: 600px) {
            .guide-card {
                padding: 1.5rem;
            }
            .guide-title {
                font-size: 1.5rem;
            }
            .tab-btn {
                font-size: 1rem;
                padding: 0.8rem;
            }
            .tab-content {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>사용 방법 안내</h1>
    </header>

    <div class="guide-container">
        <div class="guide-card">
            <h2 class="guide-title" id="app-title">앱을 불러오는 중...</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('teacher')">
                    <i class="fas fa-chalkboard-teacher"></i> 선생님을 위한 가이드
                </button>
                <button class="tab-btn" onclick="switchTab('student')">
                    <i class="fas fa-user-graduate"></i> 학생을 위한 가이드
                </button>
            </div>

            <div id="tab-teacher" class="tab-content active"></div>
            <div id="tab-student" class="tab-content"></div>
        </div>

        <div class="back-btn-container">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> 메인 화면으로 돌아가기
            </a>
        </div>
    </div>

    <!-- 하단 카피라이트 -->
    <footer class="site-footer">
        <p>만든이: 곽현석(이의초등학교)</p>
        <p>Copyright &copy; 2026 Eui Elementary School. All Rights Reserved.</p>
    </footer>

    <script>
        // 앱별 구체적인 사용 방법 데이터 (실제 따라할 수 있는 step-by-step)
        const guideData = {
            "wordtyping": {
                title: "단어 타자 연습",
                teacher: "1. 학생들에게 제공할 단어장 텍스트 파일(.txt)을 미리 준비하거나, 화면의 텍스트 박스에 직접 단어를 입력합니다.\n2. 화면에 단어가 나오면 학생들이 정확한 스펠링을 입력하도록 지도합니다.\n3. 타이핑 속도보다는 '오타 없이 정확하게 치는 것'이 중요함을 강조해 주세요.",
                student: "1. 화면 중앙에 나타나는 영어 단어를 확인합니다.\n2. 아래쪽 입력창에 똑같이 타이핑하고 [Enter] 키를 누릅니다.\n3. 틀린 글자가 있으면 지우고 다시 정확하게 입력해 보세요!"
            },
            "hangman": {
                title: "행맨 게임",
                teacher: "1. 수업 시간에 배운 단어 목록을 시스템에 입력하여 게임을 세팅합니다.\n2. 학생들에게 알파벳을 하나씩 추측하여 숨겨진 단어를 맞추게 합니다.\n3. 모음(a, e, i, o, u)을 먼저 찾아보는 등 힌트를 주며 파닉스를 복습합니다.",
                student: "1. 화면의 빈칸 개수를 보고 단어의 길이를 확인합니다.\n2. 정답에 포함될 것 같은 알파벳 버튼을 마우스로 클릭하거나 키보드로 누릅니다.\n3. 기회가 모두 사라지기 전에 숨겨진 철자를 모두 맞혀서 단어를 완성하세요!"
            },
            "alchemist": {
                title: "연금술사",
                teacher: "1. 학생들에게 제공된 기본 단어(원소)들을 이리저리 결합해 보라고 안내합니다.\n2. 뜻밖의 단어가 합성되었을 때, 두 단어가 합쳐져서 왜 그런 뜻이 되었는지 의미를 유추하도록 질문을 던져주세요.",
                student: "1. 화면에 있는 기본 단어 타일들을 마우스로 드래그해서 서로 겹쳐보세요.\n2. 올바른 조합을 찾으면 새로운 단어(결과물)가 짠! 하고 나타납니다.\n3. 만들어진 새로운 단어를 사용해 계속해서 더 많은 숨겨진 단어를 발견해 보세요."
            },
            "reading": {
                title: "영어 읽기 연습",
                teacher: "1. 학생의 수준에 맞는 지문을 선택하도록 안내합니다.\n2. 단순히 눈으로 읽는 것을 넘어, 소리 내어 문장을 읽어보도록 지도해 주세요.\n3. 모르는 단어가 나왔을 때는 문맥을 통해 의미를 먼저 유추해 보도록 격려합니다.",
                student: "1. 화면에 제시된 영어 지문을 차분히 눈으로 읽어봅니다.\n2. 머릿속으로만 읽지 말고, 입 밖으로 소리를 내어 읽으면 학습 효과가 더욱 커집니다.\n3. 문장의 구조와 의미 덩어리(청크)를 생각하며 자연스럽게 읽어 보세요."
            },
            "eng_sen": {
                title: "영어 문장 연습",
                teacher: "1. 그날 배운 핵심 문장 패턴이나 주요 구문을 입력창에 설정합니다.\n2. 학생들이 문장을 타이핑하는 동안, 단순히 글자를 치는 것이 아니라 문장의 의미를 생각하며 입력하도록 지도합니다.\n3. 완료 후, 자신이 입력한 문장을 다 같이 소리 내어 읽어보는 시간을 가지면 좋습니다.",
                student: "1. 화면에 보이는 영어 문장을 그대로 아래 입력창에 타이핑합니다.\n2. 대소문자와 띄어쓰기, 문장 부호(온점, 물음표 등)까지 정확하게 입력해야 통과됩니다.\n3. 문장을 치면서 동시에 입으로도 소리 내어 읽어보세요."
            },
            "swarm": {
                title: "Swarm 게임",
                teacher: "1. 학생들을 여러 팀으로 나누고 협동하여 문제를 해결하도록 안내합니다.\n2. 개인의 빠른 판단과 팀 전체의 조화가 중요함을 강조해 주세요.",
                student: "1. 팀원들과 실시간으로 협력하여 미션을 수행합니다.\n2. 혼자만 잘하는 것보다 다 함께 힘을 합치는 것이 승리의 열쇠입니다!"
            },
            "tictac": {
                title: "Tic Tac Toe",
                teacher: "1. 학생들에게 짝을 지어 게임 링크에 접속하도록 안내합니다.\n2. 단순한 게임 속에 숨겨진 전략을 고민해 보도록 지도합니다.",
                student: "1. 번갈아 가며 3x3 격자의 빈칸을 클릭하여 자신의 기호(O 또는 X)를 놓습니다.\n2. 가로, 세로, 혹은 대각선으로 자신의 기호 3개를 먼저 연결하는 사람이 승리합니다.\n3. 상대방이 연결하지 못하도록 전략적으로 방어하세요!"
            },
            "file_upload": {
                title: "과제 파일 제출",
                teacher: "1. 구글 드라이브(Google Drive)에 파일을 받을 폴더를 생성하고 권한을 설정합니다.\n2. 학생들에게 제출할 파일의 이름 양식(예: '학번_이름.pdf')을 명확히 안내합니다.\n3. 드라이브를 열어 학생들이 제출한 파일이 정상적으로 수합되었는지 확인합니다.",
                student: "1. 본인의 기기(컴퓨터, 패드 등)에 저장된 제출할 과제 파일을 준비합니다.\n2. 화면 중앙의 [파일 선택] 버튼을 눌러 제출할 파일을 고릅니다.\n3. 자신의 이름 등 필요한 정보를 입력하고 [제출하기] 버튼을 누른 뒤, 완료 메시지를 확인합니다."
            },
            "baseball": {
                title: "야구게임",
                teacher: "1. 기존의 숫자 야구가 아닌, 틱택토 방식을 차용한 야구 보드게임임을 안내합니다.\n2. 공격과 수비 역할을 교대하며 전략적인 수를 생각하도록 지도합니다.",
                student: "1. 틱택토의 기본 규칙(가로, 세로, 대각선 연결)에 야구의 공격/수비 개념이 추가된 게임입니다.\n2. 상대의 수를 예측하여 수비하고, 나의 공격 루트를 완성하세요.\n3. 치열한 두뇌 싸움으로 승리를 쟁취해 보세요!"
            },
            "where": {
                title: "길 찾기 게임",
                teacher: "1. 길을 묻고 답하는 주요 방향 지시어(Go straight, Turn left 등)를 미리 복습시킵니다.\n2. 학생들이 화면에 나타난 영어 지시에 따라 올바른 길을 찾아가도록 지도합니다.",
                student: "1. 화면에 제시된 길 찾기 영어 지시를 확인합니다.\n2. 지시에 맞는 알맞은 방향이나 장소를 선택하여 이동합니다.\n3. 다양한 길 찾기 표현을 익히며 목적지까지 무사히 도착해 보세요!"
            },
            "bingo": {
                title: "빙고 게임",
                teacher: "1. 수업 시간에 배운 핵심 단어나 문장을 빙고판에 입력하도록 안내합니다.\n2. 교사가 무작위로 단어를 부르거나, 학생들이 돌아가며 단어를 말하도록 진행합니다.",
                student: "1. 빙고판의 빈칸에 단어나 문장을 채워 넣습니다.\n2. 불린 단어를 확인하고 클릭하여 표시합니다.\n3. 가로, 세로, 혹은 대각선으로 줄을 완성하여 '빙고'를 외쳐보세요!"
            },
            "skribble": {
                title: "Skribble 게임",
                teacher: "1. 학생들에게 제시된 단어를 그림으로 표현하여 친구들이 맞추도록 안내합니다.\n2. 그림 그리는 사람의 창의력과 맞히는 사람의 어휘 유추 능력을 동시에 길러줍니다.",
                student: "1. 화면에 나오는 단어를 마우스로 예쁘게 그려보세요.\n2. 친구들이 그린 그림을 보고 정답 단어가 무엇일지 추측해 보세요.\n3. 가장 먼저 정답을 맞혀 높은 점수를 획득하세요!"
            }
        };
        const params = new URLSearchParams(window.location.search);
        const appId = params.get('app');

        // 해당 앱의 데이터 화면에 표시하기
        if (appId && guideData[appId]) {
            document.getElementById('app-title').innerText = guideData[appId].title;
            document.getElementById('tab-teacher').innerText = guideData[appId].teacher;
            document.getElementById('tab-student').innerText = guideData[appId].student;
        } else {
            // 잘못된 접근일 경우
            document.getElementById('app-title').innerText = "안내 정보를 찾을 수 없습니다.";
            document.getElementById('tab-teacher').innerText = "메인 화면으로 돌아가 올바른 메뉴를 선택해 주세요.";
            document.getElementById('tab-student').innerText = "메인 화면으로 돌아가 올바른 메뉴를 선택해 주세요.";
        }

        // 탭 전환 기능
        function switchTab(type) {
            // 모든 탭 버튼 비활성화
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // 모든 탭 내용 숨기기
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // 선택한 탭 활성화
            if(type === 'teacher') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
            document.getElementById(`tab-${type}`).classList.add('active');
        }
    </script>
</body>
</html>
