<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용 방법 안내 - 에듀테크 놀이터</title>
    <!-- 폰트 및 아이콘 불러오기 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .nav-back {
            display: inline-block;
            margin-top: 1rem;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .nav-back:hover {
            color: white;
        }

        .guide-container {
            max-width: 800px;
            margin: -2rem auto 4rem;
            padding: 0 1.5rem;
        }

        .guide-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 3rem 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #E5E7EB;
        }

        .app-icon {
            font-size: 3rem;
            color: var(--app-color);
            background: var(--app-bg);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .app-title {
            font-size: 2rem;
            margin: 0;
            color: var(--text-main);
        }

        /* 탭 메뉴 */
        .tabs {
            display: flex;
            border-bottom: 2px solid #E5E7EB;
            margin-bottom: 2rem;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            color: #9CA3AF;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--app-color);
            border-bottom-color: var(--app-color);
        }
        
        .tab-btn:hover:not(.active) {
            color: var(--text-muted);
        }

        .tab-content {
            display: none;
            font-size: 1.15rem;
            color: #374151;
            line-height: 1.8;
            word-break: keep-all;
            min-height: 150px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .guide-box {
            background-color: #F9FAFB;
            border-left: 5px solid var(--app-color);
            padding: 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
            margin-top: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 에러 메시지 용 */
        .error-msg {
            text-align: center;
            padding: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>앱 사용 방법</h1>
        <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> 메인 화면으로 돌아가기</a>
    </header>

    <div class="guide-container">
        <div class="guide-card" id="guide-content">
            <!-- 자바스크립트로 내용이 렌더링 됩니다 -->
        </div>
    </div>

    <script>
        // 각 앱에 대한 가이드 데이터
        const guideData = {
            "wordtyping": {
                title: "단어 타자 연습",
                icon: "fas fa-keyboard",
                theme: "#3B82F6",
                bgTheme: "#EFF6FF",
                teacher: "수업 시작 전 5분 워밍업 활동이나, 새로운 단어의 철자를 익힐 때 활용하세요. 학생들이 속도 경쟁에 치우치기보다 집중해서 정확하게 타이핑하는지 지도해 주시면 학습 효과가 뛰어납니다.",
                student: "화면에 나오는 단어를 보고 키보드로 정확하게 타이핑해 보세요! 얼마나 빨리 치느냐보다 단 한 번도 틀리지 않고 완벽하게 입력하는 것이 영어 실력에 훨씬 더 큰 도움이 됩니다."
            },
            "hangman": {
                title: "행맨 게임",
                icon: "fas fa-gamepad",
                theme: "#8B5CF6",
                bgTheme: "#F5F3FF",
                teacher: "단원 학습을 마친 후 배운 단어들을 복습하는 즐거운 게임 활동으로 좋습니다. 단어의 철자 구조와 파닉스(Phonics) 규칙을 연계하여 힌트를 주시면 아이들의 이해도가 배가 됩니다.",
                student: "화면 아래의 알파벳을 하나씩 선택해서 숨겨진 단어를 맞혀보세요. 선택할 수 있는 기회가 모두 사라지기 전에 정답을 찾아야 하는 흥미진진한 추리 게임입니다!"
            },
            "alchemist": {
                title: "연금술사 게임",
                icon: "fas fa-flask",
                theme: "#F97316",
                bgTheme: "#FFF7ED",
                teacher: "단어와 단어 사이의 의미적 관계나 합성어의 생성 원리 등을 가르칠 때 흥미 유발 자료로 훌륭합니다. 아이들이 틀리더라도 창의적이고 엉뚱한 조합을 시도하도록 칭찬하고 격려해 주세요.",
                student: "마치 마법의 약을 만드는 연금술사처럼 여러 철자나 단어 조각을 합쳐서 새로운 단어를 탄생시켜 보세요! 이것저것 실험하다 보면 놀라운 숨겨진 단어를 발견할 수 있습니다."
            },
            "eng_sen": {
                title: "영어 문장 연습",
                icon: "fas fa-book-open",
                theme: "#10B981",
                bgTheme: "#ECFDF5",
                teacher: "단원별 핵심 의사소통 표현을 문장 통째로 연습하도록 안내해 주세요. 학생들이 문장을 타이핑하는 동시에 입으로 소리 내어 읽도록 지도하시면 말하기(Speaking) 실력 향상에도 직결됩니다.",
                student: "제시된 영어 문장을 눈으로 꼼꼼히 확인하고, 손으로 타이핑하며, 입으로 크게 소리 내어 읽어보세요. 이 세 가지를 동시에 하면 영어 문장 구조가 자연스럽게 머릿속에 들어옵니다."
            },
            "file_upload": {
                title: "과제 파일 제출",
                icon: "fas fa-cloud-upload-alt",
                theme: "#6366F1",
                bgTheme: "#EEF2FF",
                teacher: "태블릿이나 스마트폰을 활용한 디지털 학습 결과물(그림, 사진, 문서 등)을 일괄적으로 수합할 때 매우 편리합니다. 학생들이 제출한 파일을 실시간으로 한눈에 확인하고 다운로드하여 관리할 수 있습니다.",
                student: "선생님께서 내주신 과제나 수업 시간에 정성껏 만든 결과물 파일을 선택해서 이곳에 업로드해 주세요. 제출하기 전에 내 이름과 학번이 정확하게 적혔는지 꼭 다시 한번 확인하세요!"
            }
        };

        const guideContent = document.getElementById('guide-content');
        
        // URL에서 '?app=id' 파라미터 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('app');

        const appData = guideData[appId];

        if (appData) {
            // CSS 변수로 테마 색상 설정
            guideContent.style.setProperty('--app-color', appData.theme);
            guideContent.style.setProperty('--app-bg', appData.bgTheme);

            // 가이드 내용 HTML 렌더링
            guideContent.innerHTML = `
                <div class="app-header">
                    <div class="app-icon"><i class="${appData.icon}"></i></div>
                    <h2 class="app-title">${appData.title}</h2>
                </div>
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('teacher')"><i class="fas fa-chalkboard-teacher"></i> 교사용 가이드</button>
                    <button class="tab-btn" onclick="switchTab('student')"><i class="fas fa-user-graduate"></i> 학생용 가이드</button>
                </div>

                <div id="tab-teacher" class="tab-content active">
                    <div class="guide-box">
                        <strong>👨‍🏫 선생님을 위한 수업 활용 팁:</strong><br><br>
                        ${appData.teacher}
                    </div>
                </div>
                <div id="tab-student" class="tab-content">
                    <div class="guide-box">
                        <strong>👩‍🎓 학생을 위한 즐거운 사용법:</strong><br><br>
                        ${appData.student}
                    </div>
                </div>
            `;
        } else {
            // 잘못된 접근 시 에러 메시지 출력
            guideContent.innerHTML = `
                <div class="error-msg">
                    <h2><i class="fas fa-exclamation-circle" style="color:#EF4444;"></i> 정보를 찾을 수 없습니다.</h2>
                    <p>올바른 경로로 접속해 주세요.</p>
                    <a href="index.html" class="tab-btn" style="display:inline-block; margin-top:1rem; border:1px solid #E5E7EB; border-radius:0.5rem; color:#4B5563; text-decoration:none;">메인으로 돌아가기</a>
                </div>
            `;
        }

        // 탭 전환 함수
        function switchTab(type) {
            // 버튼 상태 변경
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(type === 'teacher') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }

            // 콘텐츠 표시 변경
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');
        }
    </script>
</body>
</html>
