<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용 방법 안내 - 에듀테크 놀이터</title>
    <!-- 폰트 및 아이콘 불러오기 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            color: white;
            padding: 3rem 2rem 4rem; /* 간격 확보를 위해 패딩 여유 있게 수정 */
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        .nav-back {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .nav-back:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .guide-container {
            max-width: 800px;
            margin: 2rem auto 4rem; /* 음수 마진을 양수로 변경하여 카드와 헤더 사이 간격 벌림 */
            padding: 0 1.5rem;
        }

        .guide-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 3rem 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #E5E7EB;
        }

        .app-icon {
            font-size: 3rem;
            color: var(--app-color);
            background: var(--app-bg);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .app-title {
            font-size: 2rem;
            margin: 0;
            color: var(--text-main);
        }

        /* 탭 메뉴 */
        .tabs {
            display: flex;
            border-bottom: 2px solid #E5E7EB;
            margin-bottom: 2rem;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            color: #9CA3AF;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--app-color);
            border-bottom-color: var(--app-color);
        }
        
        .tab-btn:hover:not(.active) {
            color: var(--text-muted);
        }

        .tab-content {
            display: none;
            font-size: 1.15rem;
            color: #374151;
            line-height: 1.8;
            word-break: keep-all;
            min-height: 150px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .guide-box {
            background-color: #F9FAFB;
            border-left: 5px solid var(--app-color);
            padding: 1.5rem 2rem;
            border-radius: 0 0.5rem 0.5rem 0;
            margin-top: 1rem;
        }

        /* 순서형 리스트(실제 사용법)를 위한 세련된 스타일 추가 */
        .usage-list {
            margin-top: 0.8rem;
            padding-left: 1.2rem;
            line-height: 1.8;
        }
        
        .usage-list li {
            margin-bottom: 0.8rem;
        }

        .usage-list strong {
            color: var(--text-main);
            background: rgba(0,0,0,0.05);
            padding: 0.1rem 0.4rem;
            border-radius: 0.25rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 에러 메시지 용 */
        .error-msg {
            text-align: center;
            padding: 3rem;
        }

        /* 푸터 디자인 */
        .site-footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2rem;
        }

        .site-footer p {
            margin: 0.3rem 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>앱 사용 방법</h1>
        <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> 메인 화면으로 돌아가기</a>
    </header>

    <div class="guide-container">
        <div class="guide-card" id="guide-content">
            <!-- 자바스크립트로 내용이 렌더링 됩니다 -->
        </div>
    </div>

    <!-- 하단 카피라이트 -->
    <footer class="site-footer">
        <p>만든이: 곽현석(이의초등학교)</p>
        <p>Copyright &copy; 2026 Eui Elementary School. All Rights Reserved.</p>
    </footer>

    <script>
        // 각 앱에 대한 가이드 데이터
        const guideData = {
            "wordtyping": {
                title: "단어 타자 연습",
                icon: "fas fa-keyboard",
                theme: "#3B82F6",
                bgTheme: "#EFF6FF",
                teacher: "<ol class='usage-list'><li>학생들에게 학습 링크를 공유하여 각자의 기기로 접속하도록 안내합니다.</li><li>사전에 설정(톱니바퀴) 메뉴에서 그날 배울 <strong>단어 리스트를 미리 세팅</strong>해 둘 수 있습니다.</li><li>단순한 속도 경쟁보다는 오타 없이 <strong>정확도를 높이는 것</strong>을 목표로 지도해 주세요.</li><li>수업 시작 전 5분 동안 타이머를 맞추고 웜업(Warm-up) 활동으로 진행하면 좋습니다.</li></ol>",
                student: "<ol class='usage-list'><li>화면 중앙에 나타나는 영어 단어를 눈으로 꼼꼼히 확인합니다.</li><li>키보드를 이용해 스펠링을 <strong>정확하게 타이핑</strong>합니다.</li><li>입력을 마친 후 <strong>스페이스바 또는 엔터(Enter) 키</strong>를 누르면 다음 단어로 넘어갑니다.</li><li>틀리지 않고 연속으로 입력할수록 더 높은 콤보 점수를 얻을 수 있습니다!</li></ol>"
            },
            "hangman": {
                title: "행맨 게임",
                icon: "fas fa-gamepad",
                theme: "#8B5CF6",
                bgTheme: "#F5F3FF",
                teacher: "<ol class='usage-list'><li>단원별 핵심 단어를 복습할 때 스크린에 띄워두고 반 전체 활동으로 진행하거나 개별 링크로 배포합니다.</li><li>학생들이 알파벳을 고를 때, 뜻이나 <strong>파닉스(Phonics) 힌트</strong>를 주며 진행하면 효과적입니다.</li><li>정답 단어 리스트를 직접 수정하여 수업 진도에 맞게 커스텀 출제할 수 있습니다.</li></ol>",
                student: "<ol class='usage-list'><li>화면의 <strong>빈칸 개수</strong>를 보고 숨겨진 단어의 길이를 유추해 봅니다.</li><li>정답에 포함될 것 같은 알파벳을 화면 아래 버튼에서 클릭하거나 키보드로 누릅니다.</li><li>틀린 알파벳을 고를 때마다 <strong>기회(목숨)가 하나씩 줄어듭니다</strong> (행맨 그림이 그려짐).</li><li>기회가 모두 사라지기 전에 빈칸을 다 채워서 올바른 단어를 완성해 보세요!</li></ol>"
            },
            "alchemist": {
                title: "연금술사 게임",
                icon: "fas fa-flask",
                theme: "#F97316",
                bgTheme: "#FFF7ED",
                teacher: "<ol class='usage-list'><li>기본 제공되는 단어(원소)들을 결합하여 새로운 파생어나 합성어가 만들어지는 <strong>어휘 생성 원리</strong>를 보여줄 때 사용합니다.</li><li>학생들이 짝과 함께 활동하며 <strong>어떤 조합을 찾았는지 공유</strong>하게 하면 흥미가 높아집니다.</li><li>엉뚱한 조합을 시도하더라도 창의성을 칭찬하며 유쾌한 분위기로 유도해 주세요.</li></ol>",
                student: "<ol class='usage-list'><li>화면에 흩어져 있는 기본 단어나 철자(원소)들을 <strong>마우스나 터치로 드래그</strong>합니다.</li><li>서로 연관성이 있을 것 같은 두 가지 요소를 드래그하여 <strong>하나로 겹쳐봅니다.</strong></li><li>올바른 조합이면 화려한 이펙트와 함께 <strong>새로운 단어가 탄생</strong>합니다.</li><li>여러 가지 실험을 통해 도감에 숨겨진 모든 단어 조합을 찾아내 보세요!</li></ol>"
            },
            "eng_sen": {
                title: "영어 문장 연습",
                icon: "fas fa-book-open",
                theme: "#10B981",
                bgTheme: "#ECFDF5",
                teacher: "<ol class='usage-list'><li>학생들이 문장 부호(마침표, 물음표 등)와 대소문자, 띄어쓰기를 <strong>정확히 입력하도록</strong> 지도해 주세요.</li><li>타이핑을 할 때 반드시 <strong>입으로 문장을 소리 내어 따라 읽도록</strong> 규칙을 정해주시면 스피킹 실력 향상에도 직결됩니다.</li><li>오답이 났을 때 어떤 부분(스펠링, 띄어쓰기 등)이 틀렸는지 학생 스스로 찾아 고치도록 격려해 주세요.</li></ol>",
                student: "<ol class='usage-list'><li>화면 상단에 제시된 영어 문장을 꼼꼼히 읽어봅니다.</li><li>빈칸에 <strong>대소문자, 띄어쓰기, 문장 부호</strong>까지 원본과 완벽하게 똑같이 타이핑합니다.</li><li>입력하면서 반드시 입으로 <strong>문장을 소리 내어</strong> 읽어보세요.</li><li>입력 후 엔터 키를 누릅니다. 틀린 부분이 붉은색으로 표시되면 수정하여 다시 제출하세요.</li></ol>"
            },
            "file_upload": {
                title: "과제 파일 제출",
                icon: "fas fa-cloud-upload-alt",
                theme: "#6366F1",
                bgTheme: "#EEF2FF",
                teacher: "<ol class='usage-list'><li>미리 연동해 둔 <strong>선생님의 구글 드라이브 지정 폴더</strong>(예: '영어_과제제출함')를 엽니다.</li><li>학생들이 제출을 완료하면 해당 구글 드라이브 폴더에 <strong>실시간으로 파일이 저장</strong>됩니다.</li><li>제출된 파일명은 자동으로 [학번_이름] 형태로 저장되어 한눈에 수합 여부를 확인하고 평가하기 매우 편리합니다.</li></ol>",
                student: "<ol class='usage-list'><li>제출 화면에서 자신의 <strong>학년, 반, 번호</strong> 및 <strong>이름</strong>을 정확하게 입력합니다.</li><li><strong>'파일 선택'</strong>(또는 카메라) 버튼을 눌러 제출할 결과물 사진이나 문서 파일을 고릅니다.</li><li><strong>'제출하기'</strong> 버튼을 누르고, 화면에 <strong>'성공적으로 제출되었습니다'</strong>라는 완료 메시지가 뜰 때까지 브라우저를 닫지 말고 잠시 기다려 주세요.</li></ol>"
            }
        };

        const guideContent = document.getElementById('guide-content');
        
        // URL에서 '?app=id' 파라미터 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('app');

        const appData = guideData[appId];

        if (appData) {
            // CSS 변수로 테마 색상 설정
            guideContent.style.setProperty('--app-color', appData.theme);
            guideContent.style.setProperty('--app-bg', appData.bgTheme);

            // 가이드 내용 HTML 렌더링
            guideContent.innerHTML = `
                <div class="app-header">
                    <div class="app-icon"><i class="${appData.icon}"></i></div>
                    <h2 class="app-title">${appData.title}</h2>
                </div>
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('teacher')"><i class="fas fa-chalkboard-teacher"></i> 교사용 가이드</button>
                    <button class="tab-btn" onclick="switchTab('student')"><i class="fas fa-user-graduate"></i> 학생용 가이드</button>
                </div>

                <div id="tab-teacher" class="tab-content active">
                    <div class="guide-box">
                        <strong>👨‍🏫 선생님을 위한 수업 활용 팁:</strong><br><br>
                        ${appData.teacher}
                    </div>
                </div>
                <div id="tab-student" class="tab-content">
                    <div class="guide-box">
                        <strong>👩‍🎓 학생을 위한 즐거운 사용법:</strong><br><br>
                        ${appData.student}
                    </div>
                </div>
            `;
        } else {
            // 잘못된 접근 시 에러 메시지 출력
            guideContent.innerHTML = `
                <div class="error-msg">
                    <h2><i class="fas fa-exclamation-circle" style="color:#EF4444;"></i> 정보를 찾을 수 없습니다.</h2>
                    <p>올바른 경로로 접속해 주세요.</p>
                    <a href="index.html" class="tab-btn" style="display:inline-block; margin-top:1rem; border:1px solid #E5E7EB; border-radius:0.5rem; color:#4B5563; text-decoration:none;">메인으로 돌아가기</a>
                </div>
            `;
        }

        // 탭 전환 함수
        function switchTab(type) {
            // 버튼 상태 변경
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(type === 'teacher') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }

            // 콘텐츠 표시 변경
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');
        }
    </script>
</body>
</html>
